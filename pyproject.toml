[project]
name = "chock-release"
version = "0"
description = "Release manifests, consistency check and release workflow for the chock train"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S324", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["check", "rc", "release", "conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
