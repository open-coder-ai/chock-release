# Release candidate 1.0.0-rc.5: the release build on staging (org-plan plan/promotion-1.0.0.md, "rc.5").
# Every repo's list is empty: the content is on each `main` after the rc-to-main merges (D21), the chock 1.0.0
# release PR (P-5) and the catalog's adopt-framework (step 4). `rc.py assemble` merges `main` into each `rc`;
