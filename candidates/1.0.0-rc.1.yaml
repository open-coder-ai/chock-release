# Release candidate 1.0.0-rc.1: the PRs to merge into each train repo's `rc` branch, in order.
# Source: org-plan plan/internal-release.md, IR-3. Nothing here is tagged or published.
version: 1.0.0
base: main
repos:
  chock:                 [314, 315]
  # chock-catalog is merge-first, not assembled: these PRs are merged to the catalog's main first (gated by its own
  # CI; the owner merges), then rc.py pins pins the catalog's main head. rc.py assemble and prs skip it.
  chock-catalog:         [293]
  chock-claude-plugins:  [16]
  chock-cursor-plugins:  [15]
  chock-codex-plugins:   [15]
  chock-copilot-plugins: [14]
  chock-devin-plugins:   [9]
  chock-site:            [11, 78, 80]
  chock-quickstart:      []
  chock-example:         []
# Paths the candidate rewrites on `rc` after assembly (rc.py pins, then chock-site's own regeneration:
# sitegen cliexamples --record, catalogdoc, writedoc --record, docsource, agentseamdoc snapshot and
# run --record; pins also moves the engine commit in engine-commit.txt and the architecture diagrams). A merge conflict confined to these is resolved by taking the PR's side; anything
# else still refuses.
regenerated:
  chock-site:
    - .framework-ref
    - .catalog-ref
    - data/catalog-source/**
    - data/docs-source/**
    - data/write-source/**
    - data/cli-examples/**
    - data/agentseam-source/**
    - data/agentseam-run.json
    - data/kinds/engine-commit.txt
    - data/architecture/*.json
