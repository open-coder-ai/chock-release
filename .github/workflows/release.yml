name: Release

# Owner-triggered only. A dry run (the default) runs check.py, builds chock at its
# manifest commit without uploading anything, and prints the plan; it needs no
# credentials and changes nothing. A real run needs the `release` environment (owner
# approval, main only), which holds the chock-release-bot app key. See RUNBOOK.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, MAJOR.MINOR.PATCH (reads releases/<version>.yaml)"
        required: true
        type: string
      dry_run:
        description: "Dry run: check, build and print the plan only"
        required: true
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}

jobs:
  check:
    name: Check, build and plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: pip install --require-hashes -r requirements/release.txt
      - name: Run check.py and print the plan
        # The train repos are public; this job's token only raises the API rate limit.
        # A private train repo (chock-site until it is made public) reads as not found,
        # so the check refuses: it fails closed.
        # check.py validates VERSION before using it in a path.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python check.py "releases/${VERSION}.yaml" --version "$VERSION" --plan
      - name: "Step 1: dry-run build of chock at its manifest commit"
        # Clones chock at the manifest commit and builds its sdist and wheel, then refuses
        # what PyPI would refuse (a direct-reference dependency, a version mismatch).
        # Nothing is uploaded. The build's subprocesses get no credential-looking
        # variable, so chock's build backend never sees this job's token.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python release.py build "releases/${VERSION}.yaml" --version "$VERSION"

  release:
    name: Release (tags, PyPI, site)
    needs: check
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: pip install --require-hashes -r requirements/release.txt
      - name: Mint a chock-release-bot token for the train repos
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: open-coder-ai
          repositories: >-
            chock,chock-catalog,chock-claude-plugins,chock-cursor-plugins,chock-codex-plugins,
            chock-copilot-plugins,chock-devin-plugins,chock-site,chock-quickstart,chock-example
          permission-contents: write
      - name: "Step 2: check again, then tag every train repo"
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: python release.py tag "releases/${VERSION}.yaml" --version "$VERSION"
      - name: "Step 3: wait for PyPI to serve chock==VERSION"
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: python release.py pypi "releases/${VERSION}.yaml" --version "$VERSION" --timeout 3600
      - name: "Step 4: move chock-site release to the manifest commit"
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: python release.py site "releases/${VERSION}.yaml" --version "$VERSION"
      - name: "Step 5: verify the site's version marker"
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          SITE_URL: ${{ vars.RELEASE_SITE_URL || 'https://chock-site.pages.dev' }}
        run: python release.py verify "releases/${VERSION}.yaml" --version "$VERSION" --site "$SITE_URL" --timeout 1800
      - name: Write the release summary
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          SITE_URL: ${{ vars.RELEASE_SITE_URL || 'https://chock-site.pages.dev' }}
        run: |
          python release.py summary "releases/${VERSION}.yaml" --version "$VERSION" --site "$SITE_URL" > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-summary
          path: summary.md
          retention-days: 90

  publish-summary:
    name: "Step 6: GitHub release in chock-release"
    # Runs only after the approved `release` job; it reads no environment secret, only
    # this repository's own token, so it needs no second approval of its own.
    needs: release
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: release-summary
      - name: Create the GitHub release, once
        # Idempotent: a re-run after a partial failure finds the release and leaves it.
        # A v<version> tag that already exists here at another commit is refused, never
        # moved; the summary of a re-run then belongs in the release's notes by hand.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" --json tagName > existing-release.json 2>&1; then
            echo "release $tag already exists in $GH_REPO, left as is"
            exit 0
          fi
          # Only a 404 means "no such tag". Any other failure (auth, rate limit, 5xx) stops the
          # step rather than falling through to `gh release create`.
          if ! out="$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" 2>&1)"; then
            case "$out" in
              *"HTTP 404"*) out="" ;;
              *)
                echo "could not look up tag $tag in $GH_REPO: $out" >&2
                exit 1
                ;;
            esac
          fi
          if [ -n "$out" ]; then
            kind="$(jq -r '.object.type' <<<"$out")"
            existing="$(jq -r '.object.sha' <<<"$out")"
            # An annotated tag points at a tag object: follow it (bounded) to the commit it names.
            for _ in 1 2 3 4 5; do
              [ "$kind" = "tag" ] || break
              if ! out="$(gh api "repos/${GH_REPO}/git/tags/${existing}" 2>&1)"; then
                echo "could not read tag object $existing of $tag in $GH_REPO: $out" >&2
                exit 1
              fi
              kind="$(jq -r '.object.type' <<<"$out")"
              existing="$(jq -r '.object.sha' <<<"$out")"
            done
            if [ "$kind" != "commit" ]; then
              echo "tag $tag in $GH_REPO does not resolve to a commit (ends at a $kind): refusing" >&2
              exit 1
            fi
            if [ "$existing" != "$TARGET" ]; then
              echo "tag $tag already exists in $GH_REPO at $existing, this run is $TARGET: refusing" >&2
              exit 1
            fi
          fi
          gh release create "$tag" --target "$TARGET" --title "chock $tag" --notes-file summary.md
